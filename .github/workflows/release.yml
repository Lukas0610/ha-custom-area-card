# Manual release: Actions -> Release -> Run workflow (on main).
# The version comes from package.json, so the tag can never drift from it.
name: Release

on:
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version, tag and changelog
        id: version
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists - bump the version in package.json first"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          if ! grep -q "CUSTOM-AREA-CARD %c $version " dist/custom-area-card.js; then
            echo "::error::dist/custom-area-card.js was not rebuilt after the version bump"
            exit 1
          fi
          if [[ "$version" =~ (a|b|rc|dev)[0-9]+$ ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > notes.md

      # The Marketplace downloads the release asset named like "filename" in hacs.json.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            dist/custom-area-card.js \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            ${{ steps.version.outputs.prerelease }}
